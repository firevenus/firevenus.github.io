name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  # 注意：GITHUB_TOKEN 不支持 administration: write（会导致整个 workflow 文件无效）。
  # configure-pages 的 enablement 因此用不了，好在 Source 已在 Settings→Pages 手动切到 Actions 模式。

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      # Actions 模式部署用的产物包
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 兜底：legacy 分支模式（仓库 Settings 还没切到 Actions 模式时仍然生效）。
      # 两个坑，别改回去：
      # 1) 不能只靠 `git rm -rf .` —— 它会连 .gitignore 一起删掉，之后 `git add -A`
      #    就会把 node_modules 全提交进 gh-pages（2026-10 之前分支一直被这样污染）。
      # 2) `git clean -fdx` 必须在 dist 挪走之后执行，否则构建产物会被当未跟踪文件删掉。
      - name: Deploy to gh-pages branch (legacy fallback)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/site-dist
          cp -R dist /tmp/site-dist

          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true

          cp -R /tmp/site-dist/. .
          touch .nojekyll

          git add -A
          git commit -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin gh-pages

  # Actions 模式部署：完全替换线上产物，能清掉 legacy 模式残留的 2020 年旧文件。
  # 仓库还没切到 Actions 模式时这两步会失败，continue-on-error 保证流水线不红；
  # 切换成功后这里就是唯一的正式部署。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable Pages (Actions mode)
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

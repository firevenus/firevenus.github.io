name: daily-brief

on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00 = 北京 07:00，每天自动更新晨报
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write
  actions: write           # 用于触发 deploy.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Generate morning brief
        run: python scripts/daily_brief.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/morning/index.html
          if git diff --cached --quiet; then
            echo "no change, skip commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "daily brief update $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 关键：用 GITHUB_TOKEN 推送不会触发 push 事件，deploy.yml 因而不会跑，
      # 线上晨报会一直停在旧日期。这里显式派发一次部署。
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
